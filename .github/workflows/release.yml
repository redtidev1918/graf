name: Release

# 全自动发版，无需 PAT/secret：master 上合入 release-worthy 提交后 release-please 在本
# 工作流内开/更发版 PR。本仓库有两个独立组件，各自 tag：
#   - Worker（Cloudflare）：tag vX.Y.Z           → 发版同 run 内 wrangler deploy + D1 迁移
#   - grafctl（Go CLI）：  tag vX.Y.Z-grafctl   → 发版同 run 内 goreleaser 构建/发 Release
# 内置 GITHUB_TOKEN 即可（同 run 内 job 不受「推 tag 不触发新工作流」限制）。
# 仍支持手动推对应 tag 重跑。
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 要重跑的已有 tag（Worker 如 v1.0.1，grafctl 如 v0.4.3-grafctl）
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      paths: ${{ steps.rp.outputs.paths_released }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Release Please
        id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Worker 发版：release-please 为根包发 vX.Y.Z，或推 Worker tag 重跑。
  worker-deploy:
    name: Deploy worker (Cloudflare)
    runs-on: ubuntu-latest
    needs: release-please
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-grafctl')) ||
      (github.event_name == 'workflow_dispatch' && !contains(inputs.tag, '-grafctl')) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.release-please.outputs.paths != '[]' && needs.release-please.outputs.paths != '' && contains(needs.release-please.outputs.paths, '"."'))
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply graf --remote
      - name: Deploy worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

  # grafctl 发版：release-please 为 grafctl 包发 vX.Y.Z-grafctl，或推该 tag 重跑。
  grafctl-release:
    name: Release grafctl (goreleaser)
    runs-on: ubuntu-latest
    needs: release-please
    if: >-
      (github.event_name == 'push' && contains(github.ref, '-grafctl')) ||
      (github.event_name == 'workflow_dispatch' && contains(inputs.tag, '-grafctl')) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master' && contains(needs.release-please.outputs.paths, 'cmd/grafctl'))
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23'
          cache: true
      - name: Release
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
